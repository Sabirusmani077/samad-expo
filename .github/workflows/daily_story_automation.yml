name: 365-Day Instagram Story Automation (Laptop-Free Cloud Cron)

on:
  schedule:
    # Runs every day at 10:00 AM IST (04:30 UTC) 365 days a year
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Force publish even if already posted today? (true/false)"
        default: "false"

concurrency:
  group: instagram-story-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily_story_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Daily Story Publisher
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY || 'ck__T_ze5xVZbUYRsXeBeAl' }}
          IG_USER_ID: "30117369684532329"
          IG_ACCOUNT_SLUG: "instagram_hurry-buri"
          VIDEO_URL: "https://samad-expo.vercel.app/story_video.mp4"
        run: |
          python scripts/publish_daily_story.py

      - name: Commit & Push 365-Day Story Ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/story_log.json
          git diff --staged --quiet || (git commit -m "chore(story): record daily Instagram story publication [skip ci]" && git pull --rebase -X ours origin main && git push origin HEAD:main)
